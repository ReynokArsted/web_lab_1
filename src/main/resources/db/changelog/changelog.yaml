databaseChangeLog:
  - changeSet:
      id: 1
      author: reynok
      changes:
        - createTable:
            tableName: note
            columns:
              - column:
                  name: note_id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: content
                  type: VARCHAR(255)

  - changeSet:
      id: 2
      author: reynok
      changes:
        - modifyDataType:
            tableName: note
            columnName: note_id
            newDataType: BIGSERIAL
        - modifyDataType:
            tableName: note
            columnName: title
            newDataType: TEXT
        - modifyDataType:
            tableName: note
            columnName: content
            newDataType: TEXT
  - changeSet:
      id: 3
      author: reynok
      changes:
        - dropTable:
            tableName: note
        - createTable:
            tableName: note
            columns:
              - column:
                  name: note_id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: TEXT
              - column:
                  name: content
                  type: TEXT
  - changeSet:
      id: 4
      author: reynok
      changes:
        - createTable:
            tableName: tag
            columns:
              - column:
                  name: tag_id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
        - dropTable:
            tableName: note
        - createTable:
            tableName: note
            columns:
              - column:
                  name: note_id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: TEXT
              - column:
                  name: content
                  type: TEXT
        - addForeignKeyConstraint:
            constraintName: fk_note_tag
            baseTableName: note
            baseColumnNames: tag_id
            referencedTableName: tag
            referencedColumnNames: tag_id
  - changeSet:
      id: 5
      author: reynok
      changes:
        - createTable:
            tableName: note_tags
            columns:
              - column:
                  name: note_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: note_tags
            baseColumnNames: note_id
            referencedTableName: note
            referencedColumnNames: note_id
            constraintName: fk_note_tags_note
        - addForeignKeyConstraint:
            baseTableName: note_tags
            baseColumnNames: tag_id
            referencedTableName: tag
            referencedColumnNames: tag_id
            constraintName: fk_note_tags_tag
  - changeSet:
      id: 6
      author: reynok
      changes:
        - dropColumn:
            tableName: note
            columnName: tag_id
  - changeSet:
      id: 7
      author: reynok
      changes:
        - createTable:
            tableName: attachment
            columns:
              - column:
                  name: attachment_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: data
                  type: BYTEA
        - addColumn:
            tableName: note
            columns:
              - column:
                  name: attachment_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: note
            baseColumnNames: attachment_id
            referencedTableName: attachment
            referencedColumnNames: attachment_id
            constraintName: fk_note_attachment
  - changeSet:
      id: 8
      author: reynok
      changes:
        - addColumn:
            tableName: note
            columns:
              - column:
                  name: last_edit_time
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
  - changeSet:
      id: 9
      author: reynok
      changes:
        - createSequence:
            sequenceName: attachment_id_seq
            startValue: 1
            incrementBy: 1
        - addDefaultValue:
            tableName: attachment
            columnName: attachment_id
            defaultValueSequenceNext: attachment_id_seq
