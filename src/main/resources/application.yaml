spring:
  application:
    name: lab1

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: validate 
    show-sql: true      
        
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.yaml

  servlet:
    multipart:
      max-file-size: 100MB     
      max-request-size: 200MB 

server:
  port: 8080